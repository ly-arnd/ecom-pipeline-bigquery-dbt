version: 2

sources:
  - name: ecommerce-data-landing_gcs
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: landing
    description: "External tables created by dbt from GCS CSV files."
    tables:
      - name: olist_customers
        description: "External table containing OLIST customer data from GCS CSV file"
        external:
          location: "gs://{{ env_var('GCP_BUCKET_NAME') }}/olist_customers_dataset*.csv"
          options:
            format: csv
            field_delimiter: ","
            skip_leading_rows: 1
      - name: olist_geolocation
        description: "External table containing OLIST geolocation data from GCS CSV file"
        external:
          location: "gs://{{ env_var('GCP_BUCKET_NAME') }}/olist_geolocation_dataset*.csv"
          options:
            format: csv
            field_delimiter: ","
            skip_leading_rows: 1
      - name: olist_order_items
        description: "External table containing OLIST order items data from GCS CSV file"
        external:
          location: "gs://{{ env_var('GCP_BUCKET_NAME') }}/olist_order_items_dataset*.csv"
          options:
            format: csv
            field_delimiter: ","
            skip_leading_rows: 1
      - name: olist_order_payments
        description: "External table containing OLIST order payments data from GCS CSV file"
        external:
          location: "gs://{{ env_var('GCP_BUCKET_NAME') }}/olist_order_payments_dataset*.csv"
          options:
